<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>root@archive:~$</title>
<style>
  :root {
    --bg: #0a0e0a;
    --panel: #0d130d;
    --panel-hover: #121a12;
    --panel-active: #17321c;
    --border: #1d2e1d;
    --green: #33ff66;
    --green-dim: #1f9c3f;
    --green-faint: #4d7a58;
    --bubble-in: #10160f;
    --bubble-out: #10240f;
    --text: #c9f5d1;
    --font: 'JetBrains Mono', 'Fira Code', 'Courier New', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; padding: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      linear-gradient(rgba(20,40,20,0.06) 1px, transparent 1px);
    background-size: 100% 3px;
  }
  #app { display: flex; height: 100%; }

  /* ---------------- Sidebar ---------------- */
  #sidebar {
    width: 380px; min-width: 300px; background: var(--panel);
    display: flex; flex-direction: column; border-right: 1px solid var(--border);
  }
  #sidebar-title {
    padding: 12px 14px 6px; font-size: 12px; color: var(--green-dim);
    letter-spacing: 1px; display: flex; align-items: center; gap: 8px;
  }
  #sidebar-title .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 6px var(--green); flex-shrink: 0;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 4px var(--green); }
    50% { opacity: 0.4; box-shadow: 0 0 10px var(--green); }
  }
  #sidebar-search { padding: 8px 12px 12px; border-bottom: 1px solid var(--border); }
  #sidebar-search input {
    width: 100%; padding: 9px 12px; border-radius: 2px;
    border: 1px solid var(--border); background: var(--bg); color: var(--green);
    font-family: var(--font); font-size: 13px; outline: none;
  }
  #sidebar-search input::placeholder { color: var(--green-faint); }
  #sidebar-search input:focus { border-color: var(--green-dim); }
  #chat-list { flex: 1; overflow-y: auto; }
  .chat-item {
    display: flex; align-items: center; padding: 10px 14px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s ease, border-left-color 0.15s ease;
    border-left: 2px solid transparent;
  }
  .chat-item:hover { background: var(--panel-hover); }
  .chat-item.active { background: var(--panel-active); border-left: 2px solid var(--green); }
  .avatar {
    width: 44px; height: 44px; border-radius: 2px; object-fit: cover;
    background: #0f1e11; border: 1px solid var(--green-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: var(--green); flex-shrink: 0; overflow: hidden;
  }
  #chat-header .avatar { width: 38px; height: 38px; font-size: 13px; }
  .chat-item-text { margin-left: 12px; overflow: hidden; flex: 1; }
  .chat-item-top { display: flex; justify-content: space-between; align-items: baseline; }
  .chat-item-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item-time { font-size: 11px; color: var(--green-faint); flex-shrink: 0; margin-left: 8px; }
  .chat-item-preview { font-size: 12.5px; color: var(--green-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  /* ---------------- Chat pane ---------------- */
  #chat-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat-header {
    display: flex; align-items: center; padding: 10px 18px; background: var(--panel);
    border-bottom: 1px solid var(--border); min-height: 58px;
  }
  #back-btn {
    display: none; background: none; border: none; color: var(--green);
    font-family: var(--font); font-size: 18px; margin-right: 10px; cursor: pointer;
    padding: 4px 6px; transition: transform 0.15s ease, text-shadow 0.15s ease;
  }
  #back-btn:hover { transform: translateX(-3px); text-shadow: 0 0 8px var(--green); }
  #chat-header-info { margin-left: 12px; overflow: hidden; }
  #chat-header-name { font-size: 14.5px; font-weight: 600; color: var(--text); }
  #chat-header-sub { font-size: 12px; color: var(--green-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 480px; }

  #messages { flex: 1; overflow-y: auto; padding: 18px 8%; }
  .day-divider {
    text-align: center; color: var(--green-faint); font-size: 11px; margin: 16px 0;
    letter-spacing: 1px;
  }
  .day-divider::before, .day-divider::after { content: "── "; }
  .day-divider::after { content: " ──"; }
  .msg-row { display: flex; margin-bottom: 6px; animation: msg-in 0.22s ease-out; }
  .msg-row.out { justify-content: flex-end; }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .bubble {
    max-width: 66%; padding: 8px 12px 6px; border-radius: 2px; font-size: 14px;
    line-height: 1.45; word-wrap: break-word; border: 1px solid var(--border);
    transition: border-color 0.15s ease;
  }
  .msg-row.in .bubble { background: var(--bubble-in); border-left: 2px solid var(--green-dim); }
  .msg-row.out .bubble { background: var(--bubble-out); border-right: 2px solid var(--green); }
  .bubble img { max-width: 100%; border-radius: 2px; margin-bottom: 4px; display: block; border: 1px solid var(--border); }
  .bubble-text { white-space: pre-wrap; color: var(--text); }
  .bubble-meta { display: flex; gap: 6px; justify-content: flex-end; margin-top: 3px; font-size: 10.5px; color: var(--green-faint); }

  #empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--green-faint); font-size: 14px;
  }
  #empty-state::before { content: "> "; color: var(--green); }

  ::-webkit-scrollbar { width: 7px; }
  ::-webkit-scrollbar-thumb { background: var(--border); }
  ::-webkit-scrollbar-thumb:hover { background: var(--green-dim); }

  /* ---------------- Mobile ---------------- */
  @media (max-width: 768px) {
    #sidebar { width: 100%; min-width: 0; }
    #chat-pane {
      display: flex; width: 100%; position: fixed; top: 0; right: 0; height: 100%;
      transform: translateX(100%); transition: transform 0.22s ease; background: var(--bg);
    }
    #app.chat-open #sidebar { display: none; }
    #app.chat-open #chat-pane { transform: translateX(0); }
    #back-btn { display: inline-block; }
    #messages { padding: 14px 4%; }
    .bubble { max-width: 82%; }
    #chat-header-sub { max-width: 60vw; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-title"><span class="dot"></span>archive://chats</div>
    <div id="sidebar-search"><input type="text" id="search-input" placeholder="grep contact..."></div>
    <div id="chat-list"></div>
  </div>
  <div id="chat-pane">
    <div id="empty-state">select a chat to view messages</div>
  </div>
</div>

<script>
  const REFRESH_LIST_MS = 20000;  // sidebar refresh interval
  const REFRESH_CHAT_MS = 5000;   // open-chat refresh interval (incremental "after" fetch)

  let currentUserId = null;
  const usersCache = {};
  let openChatMessages = new Map();  // message_id -> message object, for the currently open chat
  let openChatCursor = null;         // latest "updated_at" seen, for incremental polling

  function initials(name) { return name ? name.trim().charAt(0).toUpperCase() : "?"; }

  function avatarEl(user) {
    const div = document.createElement("div");
    div.className = "avatar";
    if (user.dp_url) {
      const img = document.createElement("img");
      img.src = user.dp_url;
      img.style.width = "100%"; img.style.height = "100%"; img.style.objectFit = "cover";
      div.appendChild(img);
    } else {
      div.textContent = initials(user.first_name || user.username);
    }
    return div;
  }

  function fmtTime(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  function fmtDay(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleDateString([], { day: "2-digit", month: "short" });
  }

  async function fetchUsers() {
    try {
      const res = await fetch("/api/users");
      return await res.json();
    } catch (e) {
      console.error("failed to load users", e);
      return [];
    }
  }

  async function fetchMessages(userId, after) {
    try {
      let url = "/api/messages?user_id=" + encodeURIComponent(userId);
      if (after) url += "&after=" + encodeURIComponent(after);
      const res = await fetch(url);
      return await res.json();
    } catch (e) {
      console.error("failed to load messages", e);
      return [];
    }
  }

  function renderChatList(users) {
    users.sort((a, b) => {
      const ta = a.last ? new Date(a.last.sent_at).getTime() : 0;
      const tb = b.last ? new Date(b.last.sent_at).getTime() : 0;
      return tb - ta;
    });

    const list = document.getElementById("chat-list");
    list.innerHTML = "";

    users.forEach(u => {
      usersCache[u.id] = u;

      const item = document.createElement("div");
      item.className = "chat-item" + (u.id === currentUserId ? " active" : "");
      item.dataset.userId = u.id;

      const av = avatarEl(u);
      const textWrap = document.createElement("div");
      textWrap.className = "chat-item-text";

      const top = document.createElement("div");
      top.className = "chat-item-top";
      const nameEl = document.createElement("div");
      nameEl.className = "chat-item-name";
      nameEl.textContent = [u.first_name, u.last_name].filter(Boolean).join(" ") || u.username || u.id;
      const timeEl = document.createElement("div");
      timeEl.className = "chat-item-time";
      timeEl.textContent = u.last ? fmtTime(u.last.sent_at) : "";
      top.appendChild(nameEl); top.appendChild(timeEl);

      const preview = document.createElement("div");
      preview.className = "chat-item-preview";
      // Deleted messages are shown exactly like normal ones — no indicator here.
      if (u.last) {
        preview.textContent = u.last.media_url ? "[img] " + (u.last.text || "") : (u.last.text || "");
      } else {
        preview.textContent = "no messages yet";
      }

      textWrap.appendChild(top); textWrap.appendChild(preview);
      item.appendChild(av); item.appendChild(textWrap);
      item.addEventListener("click", () => openChat(u.id));
      list.appendChild(item);
    });

    applySearchFilter();
  }

  document.getElementById("search-input").addEventListener("input", applySearchFilter);
  function applySearchFilter() {
    const q = document.getElementById("search-input").value.toLowerCase();
    document.querySelectorAll(".chat-item").forEach(item => {
      const name = item.querySelector(".chat-item-name").textContent.toLowerCase();
      item.style.display = name.includes(q) ? "" : "none";
    });
  }

  function renderHeader(user) {
    const header = document.createElement("div");
    header.id = "chat-header";

    const back = document.createElement("button");
    back.id = "back-btn";
    back.textContent = "←";
    back.addEventListener("click", closeChat);
    header.appendChild(back);

    const av = avatarEl(user);
    const info = document.createElement("div");
    info.id = "chat-header-info";
    const nameEl = document.createElement("div");
    nameEl.id = "chat-header-name";
    nameEl.textContent = [user.first_name, user.last_name].filter(Boolean).join(" ") || user.username || user.id;
    const subEl = document.createElement("div");
    subEl.id = "chat-header-sub";
    const subParts = [];
    if (user.username) subParts.push("@" + user.username);
    if (user.phone) subParts.push("+" + user.phone);
    if (user.bio) subParts.push(user.bio);
    subEl.textContent = subParts.join(" · ");
    info.appendChild(nameEl); info.appendChild(subEl);
    header.appendChild(av); header.appendChild(info);
    return header;
  }

  function renderMessages(msgsEl, msgs) {
    const wasAtBottom = msgsEl.scrollTop + msgsEl.clientHeight >= msgsEl.scrollHeight - 40;
    msgsEl.innerHTML = "";
    let lastDay = null;

    msgs.forEach(m => {
      const day = fmtDay(m.sent_at);
      if (day !== lastDay) {
        const divider = document.createElement("div");
        divider.className = "day-divider";
        divider.textContent = day;
        msgsEl.appendChild(divider);
        lastDay = day;
      }

      const row = document.createElement("div");
      row.className = "msg-row " + (m.direction === "outgoing" ? "out" : "in");

      const bubble = document.createElement("div");
      // Deleted messages render identically to normal ones — content shown,
      // no tag, no styling difference. That's the whole point of the archive.
      bubble.className = "bubble " + (m.direction === "outgoing" ? "out" : "in");

      if (m.media_url) {
        const img = document.createElement("img");
        img.src = m.media_url;
        bubble.appendChild(img);
      }
      if (m.text) {
        const txt = document.createElement("div");
        txt.className = "bubble-text";
        txt.textContent = m.text;
        bubble.appendChild(txt);
      }

      const meta = document.createElement("div");
      meta.className = "bubble-meta";
      if (m.edited_at) {
        const tag = document.createElement("span");
        tag.textContent = "edited";
        meta.appendChild(tag);
      }
      const time = document.createElement("span");
      time.textContent = fmtTime(m.sent_at);
      meta.appendChild(time);
      bubble.appendChild(meta);

      row.appendChild(bubble);
      msgsEl.appendChild(row);
    });

    if (wasAtBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  let chatRefreshTimer = null;

  function closeChat() {
    currentUserId = null;
    if (chatRefreshTimer) clearInterval(chatRefreshTimer);
    document.getElementById("app").classList.remove("chat-open");
    document.querySelectorAll(".chat-item").forEach(el => el.classList.remove("active"));
  }

  async function openChat(userId) {
    currentUserId = userId;
    openChatMessages = new Map();
    openChatCursor = null;

    document.getElementById("app").classList.add("chat-open");
    document.querySelectorAll(".chat-item").forEach(el => {
      el.classList.toggle("active", el.dataset.userId === userId);
    });

    const user = usersCache[userId] || { id: userId };
    const pane = document.getElementById("chat-pane");
    pane.innerHTML = "";
    pane.appendChild(renderHeader(user));

    const msgsEl = document.createElement("div");
    msgsEl.id = "messages";
    pane.appendChild(msgsEl);

    function applyDelta(msgs) {
      let changed = false;
      msgs.forEach(m => {
        openChatMessages.set(m.message_id, m);
        if (!openChatCursor || (m.updated_at && m.updated_at > openChatCursor)) {
          openChatCursor = m.updated_at || openChatCursor;
        }
        changed = true;
      });
      if (changed) {
        const sorted = Array.from(openChatMessages.values())
          .sort((a, b) => new Date(a.sent_at) - new Date(b.sent_at));
        renderMessages(msgsEl, sorted);
      }
    }

    async function refresh(initial) {
      if (currentUserId !== userId) return; // user switched/closed chat, stop
      const msgs = await fetchMessages(userId, initial ? null : openChatCursor);
      applyDelta(msgs);
    }

    await refresh(true);
    msgsEl.scrollTop = msgsEl.scrollHeight;

    if (chatRefreshTimer) clearInterval(chatRefreshTimer);
    chatRefreshTimer = setInterval(() => refresh(false), REFRESH_CHAT_MS);
  }

  async function refreshList() {
    const users = await fetchUsers();
    renderChatList(users);
  }

  refreshList();
  setInterval(refreshList, REFRESH_LIST_MS);
</script>
</body>
</html>
